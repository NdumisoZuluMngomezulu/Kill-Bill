image: docker:latest

services:
    - docker:dind

stages:
    - compile
    - test
    - package
    - release

variables:
    DOCKER_DRIVER: overlay2
    PROJECT_DIR: "kill_bil/"
    JAR_DIR: "libs/"
    DOCKER_IMAGE_NAME: "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}"

before_script:
    - apk add --no-cache openjdk17 maven
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

compile:
    stage: compile
    script:
        - echo "compiling"
        - cd $PROJECT_DIR
        - mvn clean compile
        - mvn compile

test:
    stage: test
    script:
        - echo "Testing"
        - cd $PROJECT_DIR
        - cd $JAR_DIR
        - java -jar reference-server-0.2.3.jar -s 2 -o 1,1 &
        - cd ..
        - mvn test
        - pkill -f reference-server-0.2.3.jar


package:
    stage: package
    script:
        - echo "packaging"
        - cd $PROJECT_DIR
        - cd $JAR_DIR
        - java -jar reference-server-0.2.3.jar -s 2 -o 1,1 &
        - cd ..
        - mvn package
        - pkill -f reference-server-0.2.3.jar

release:
    stage: release
    script:
        - echo "Listing files"
        - cd $PROJECT_DIR
        - echo "Building Docker image"
        - docker build -t $DOCKER_IMAGE_NAME .
        - docker tag $DOCKER_IMAGE_NAME "${CI_REGISTRY_IMAGE}:latest"
        - echo "Pushing Docker image"
        - docker push $DOCKER_IMAGE_NAME
        - docker push "${CI_REGISTRY_IMAGE}:latest"
